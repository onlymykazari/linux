name: compile check
on:
  push:
    branches: [ci-compile-check]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev python3 dwarves
      - name: Configure
        run: make ARCH=arm64 caihong_defconfig
      - name: Build
        run: make ARCH=arm64 LOCALVERSION=-ufsfix -j"$(nproc)" Image qcom/sm8650-oneplus-caihong.dtb
      - name: Show kernel release
        run: make ARCH=arm64 LOCALVERSION=-ufsfix kernelrelease
      - uses: actions/upload-artifact@v4
        with:
          name: ufsfix-boot-assets
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/qcom/sm8650-oneplus-caihong.dtb
          compression-level: 0
          retention-days: 7
